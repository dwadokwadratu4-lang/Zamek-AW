<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B1220" />
      <stop offset="55%" stop-color="#3B0A14" />
      <stop offset="100%" stop-color="#24070D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6DF90" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7618" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D982" />
      <stop offset="100%" stop-color="#A87E1E" />
    </linearGradient>
  </defs>

  <!-- Full-bleed burgundy-gold background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="url(#goldBorder)" stroke-width="6" opacity="0.85" />
  <rect x="34" y="34" width="444" height="444" rx="68" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4" />

  <!-- Golden Castle Tower Silhouette -->
  <g transform="translate(256, 74)">
    <!-- Spire & Flag -->
    <line x1="0" y1="0" x2="0" y2="34" stroke="#F6DF90" stroke-width="5" stroke-linecap="round" />
    <polygon points="2,4 42,14 2,24" fill="url(#goldGrad)" />
    <!-- Gothic Spire Roof -->
    <polygon points="0,28 -44,96 44,96" fill="url(#goldGrad)" />
    <!-- Battlements / Merlons -->
    <rect x="-54" y="96" width="108" height="20" rx="2" fill="url(#goldGrad)" />
    <rect x="-54" y="84" width="18" height="14" fill="url(#goldGrad)" />
    <rect x="-22" y="84" width="18" height="14" fill="url(#goldGrad)" />
    <rect x="10" y="84" width="18" height="14" fill="url(#goldGrad)" />
    <rect x="36" y="84" width="18" height="14" fill="url(#goldGrad)" />
    <!-- Tower Body -->
    <rect x="-44" y="116" width="88" height="136" fill="url(#goldGrad)" />
    <!-- Side Bastion Wings -->
    <rect x="-92" y="168" width="48" height="84" fill="url(#goldGrad)" opacity="0.9" />
    <rect x="44" y="168" width="48" height="84" fill="url(#goldGrad)" opacity="0.9" />
    <rect x="-96" y="156" width="14" height="14" fill="url(#goldGrad)" />
    <rect x="-72" y="156" width="14" height="14" fill="url(#goldGrad)" />
    <rect x="58" y="156" width="14" height="14" fill="url(#goldGrad)" />
    <rect x="82" y="156" width="14" height="14" fill="url(#goldGrad)" />
    <!-- Gothic Lancet Window & Gate Arch -->
    <path d="M -14 148 Q 0 128 14 148 L 14 176 L -14 176 Z" fill="#3B0A14" />
    <path d="M -22 252 L -22 212 Q 0 190 22 212 L 22 252 Z" fill="#3B0A14" />
    <!-- Base Plinth -->
    <rect x="-106" y="252" width="212" height="14" rx="3" fill="url(#goldGrad)" />
  </g>

  <!-- Crisp White Monogram AW -->
  <text x="256" y="424" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="10">AW</text>
</svg>
